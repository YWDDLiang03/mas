[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.1.0"
description = "Agent-centered multi-agent system for evidence-driven candidate prioritization (v1, slice A)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mas = "mas.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs something the offline suite does not have: network access to PubChem, ChEMBL and Europe PMC, or the local predictor environment"]
addopts = "-m 'not live'"
