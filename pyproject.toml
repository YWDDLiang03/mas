[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "1.1.0"
description = "Evidence-driven research criteria, candidate qualification and ranking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.urls]
Repository = "https://github.com/YWDDLiang03/mas"
Documentation = "https://github.com/YWDDLiang03/mas/tree/main/docs"
Issues = "https://github.com/YWDDLiang03/mas/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mas = "mas.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs something the offline suite does not have: network access to PubChem, ChEMBL and Europe PMC, or the local predictor environment"]
addopts = "-m 'not live'"
